# Deploys the site to GitHub Pages on every push to main.
# The original site (index.html at git tag v1) stays at the root URL, and the
# current index.html is published as the revamp under /v2/.
# Repo files like CLAUDE.md and README.md are not published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; skip queued ones in between
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so the v1 tag is available

      - name: Collect site files
        run: |
          mkdir -p _site/v2
          git show v1:index.html > _site/index.html
          cp index.html _site/v2/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
